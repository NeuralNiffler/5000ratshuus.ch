# Pipeline (Umsetzungsplan Phase 1c, Schritte 11-16).
#
# Zwei Auslöser:
#   - repository_dispatch (Typ "newsletter-eingang"): der Regelfall. Der
#     Email Worker (workers/eingang/) ruft ihn auf, sobald eine Mail von
#     kommunikation@aarau.ch an newsletter@5000ratshuus.ch eintrifft. Die
#     Nutzdaten stehen in github.event.client_payload.
#   - workflow_dispatch: manueller Notausgang, z. B. um eine Ausgabe nachzuholen
#     oder die Pipeline zu testen. Für einen mehrseitigen Mailtext eher über
#     die API/gh CLI befüllen: die GitHub-UI zeigt für den Eingabetyp "string"
#     nur ein einzeiliges Textfeld.
#
# Sicherheit: Betreff und Mailtext stammen aus einer externen Mail. Sie
# werden deshalb NIE per ${{ ... }} in ein run:-Skript eingesetzt (das wäre
# eine Script-Injection-Lücke), sondern nur über env: als Umgebungsvariablen
# übergeben und in der Shell in Anführungszeichen verwendet.
#
# Nötige Repo-Secrets:
#   - ANTHROPIC_API_KEY (Schritt "Pipeline ausführen")
#   - (kein Cloudflare-Token nötig: der Deploy läuft über die Git-Integration)
name: Pipeline (Newsletter-Ausgabe verarbeiten)

on:
  repository_dispatch:
    types: [newsletter-eingang]
  workflow_dispatch:
    inputs:
      mailtext:
        description: "Klartext der Newsletter-Ausgabe"
        required: true
        type: string
      betreff:
        description: "Betreff der Newsletter-Mail"
        required: true
        type: string
      newsletter_datum:
        description: "Versanddatum wie im Newsletter, z. B. 28.08.2026"
        required: true
        type: string
      message_id:
        description: "Eindeutige Message-ID der Mail (für Idempotenz, F1)"
        required: true
        type: string
      erzwingen:
        description: "Filter überspringen und die Mail trotzdem verarbeiten (z. B. fälschlich aussortiert)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    # Je nach Auslöser stehen die Werte in inputs (manuell) oder client_payload
    # (Email Worker). Einmal hier vereinheitlichen, danach nur noch $VARIABLEN.
    env:
      MAILTEXT: ${{ inputs.mailtext || github.event.client_payload.mailtext }}
      BETREFF: ${{ inputs.betreff || github.event.client_payload.betreff }}
      NEWSLETTER_DATUM: ${{ inputs.newsletter_datum || github.event.client_payload.newsletter_datum }}
      MESSAGE_ID: ${{ inputs.message_id || github.event.client_payload.message_id }}
      # Nur beim manuellen Lauf gesetzt. Leer statt "false", damit die Shell
      # das Flag per ${ERZWINGEN:+...} weglässt.
      ERZWINGEN: ${{ inputs.erzwingen == true && 'true' || '' }}
    steps:
      # ref: main statt des Standard-SHA: Bei repository_dispatch (und bei
      # jedem Re-Run) ist der SHA der Stand von main beim Auslösen. Kommen zwei
      # Mails kurz nacheinander, wartet der zweite Lauf dank concurrency zwar
      # auf den ersten, würde aber ohne ref den Stand vor dessen Push auschecken
      # und beim Push abgelehnt (so geschehen am 02.10.2026).
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Node einrichten
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Abhängigkeiten installieren
        run: npm ci

      # Bewusst in eine Runner-Temp-Datei statt ins Repo: Rohmails/Mailtext
      # dürfen bei öffentlichem Repo nie committet werden (siehe
      # docs/entscheide/2026-09-16-stack.md, Absatz zur Repo-Sichtbarkeit).
      - name: Mailtext in Runner-Temp-Datei schreiben
        run: printf '%s' "$MAILTEXT" > "$RUNNER_TEMP/mailtext.txt"

      - name: Pipeline ausführen
        id: pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Modellwahl: Standard ist claude-sonnet-5 (scripts/pipeline/claude-client.ts).
          # Zum Umschalten das # entfernen. Opus 5.5 kostet pro Token doppelt so viel.
          # ANTHROPIC_MODEL: claude-opus-5-5
        run: |
          npm run pipeline:run -- \
            --mailtext-datei "$RUNNER_TEMP/mailtext.txt" \
            --betreff "$BETREFF" \
            --newsletter-datum "$NEWSLETTER_DATUM" \
            --message-id "$MESSAGE_ID" \
            ${ERZWINGEN:+--erzwingen}

      - name: Protokoll in Job Summary schreiben
        if: always()
        run: |
          echo '### Pipeline-Protokoll' >> "$GITHUB_STEP_SUMMARY"
          for f in .build/pipeline-log/*.json; do
            [ -f "$f" ] || continue
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat "$f" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done

      # Direkter Push statt PR: konsistent mit dem bereits getroffenen
      # Entscheid "autonome Publikation ohne Freigabeschritt" (Abschnitt 13).
      # Committet die neue Ausgabe (falls vorhanden) und immer die Zeile in
      # docs/pipeline-entscheide.csv, damit auch aussortierte Mails im Repo
      # nachvollziehbar sind. Fehlerläufe erreichen diesen Schritt nicht, sie
      # sind über das Issue "pipeline-fehler" sichtbar.
      # "git pull --rebase" vor dem Push fängt Commits ab, die während des
      # Laufs auf main gelandet sind (z. B. ein manueller Push). Die CSV-Zeile
      # führt dabei nicht zum Konflikt, siehe merge=union in .gitattributes.
      - name: Neue Ausgabe und Entscheid committen und pushen
        id: push
        if: success()
        run: |
          git config user.name "5000ratshuus-pipeline[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add src/content/ausgaben/
          if git diff --cached --quiet; then
            nachricht="Pipeline-Entscheid: $BETREFF"
          else
            nachricht="Automatisch erzeugte Ausgabe: $BETREFF"
          fi
          git add docs/pipeline-entscheide.csv
          if git diff --cached --quiet; then
            echo "Nichts zu committen."
          else
            git commit -m "$nachricht"
            git pull --rebase origin main
            git push
          fi

      - name: Entwurf als Artifact hochladen (bei Fehlschlag)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pipeline-entwurf-${{ github.run_id }}
          path: |
            src/content/ausgaben/
            .build/pipeline-log/
          retention-days: 14
          if-no-files-found: warn

      # Nutzt nur den Standard-GITHUB_TOKEN, kein zusätzlicher
      # Benachrichtigungsdienst nötig (Schritt 15: "Robin bei Fehlern
      # benachrichtigen"). Der Text geht über eine Datei, nicht über eine
      # Shell-Zeichenkette: das Protokoll enthält den (externen) Betreff.
      #
      # Titel und erste Zeilen sagen, wo der Lauf gescheitert ist und was
      # entschieden wurde, damit die Benachrichtigung allein reicht, um
      # "harmlos, neu starten" von "Mail nicht verarbeitet" zu unterscheiden.
      # Drei Fälle nach den Step-Outcomes:
      #   - Push gescheitert: Entscheid steht fest, nur der Commit fehlt
      #     (CSV-Zeile und ggf. Ausgabe). Ein Re-Run holt ihn nach.
      #   - Pipeline gescheitert: Mail nicht verarbeitet, Fehler aus dem Protokoll.
      #   - davor gescheitert (npm ci usw.): es gibt kein Protokoll.
      - name: Bei Fehlschlag ein Issue erstellen
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          LAUF_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PIPELINE_OUTCOME: ${{ steps.pipeline.outcome }}
          PUSH_OUTCOME: ${{ steps.push.outcome }}
        run: |
          protokoll=$(ls .build/pipeline-log/*.json 2>/dev/null | tail -n 1)
          # "|| true": Der Runner nutzt bash -e, ohne Protokoll bräche sonst das
          # Skript ab und das Issue (der Alarm) bliebe aus.
          feld() { [ -n "$protokoll" ] && jq -r --arg f "$1" '.[$f] // empty' "$protokoll" || true; }
          entscheid=$(feld entscheid)
          quelle=$(feld quelle)
          grund=$(feld grund)
          fehler=$(feld fehler)

          if [ "$PUSH_OUTCOME" = "failure" ]; then
            phase="beim Push"
            case "$entscheid" in
              verarbeitet)
                hinweis="Die Ausgabe wurde erzeugt und geprüft, aber nicht publiziert. Lauf neu starten (\"Re-run failed jobs\"). Achtung: Der Re-Run erzeugt den Artikel neu, mit neuem Claude-Aufruf." ;;
              *)
                hinweis="Der Entscheid ist korrekt gefallen, nur die Zeile in docs/pipeline-entscheide.csv fehlt im Repo. Kein Grund zur Sorge: Lauf neu starten (\"Re-run failed jobs\"), das holt die Zeile nach." ;;
            esac
          elif [ "$PIPELINE_OUTCOME" = "failure" ]; then
            phase="in der Verarbeitung"
            hinweis="Die Mail wurde nicht verarbeitet. Fehler prüfen, beheben und den Lauf neu starten."
          else
            phase="vor der Verarbeitung"
            hinweis="Der Lauf ist vor der Pipeline gescheitert (z. B. npm ci), die Mail wurde nicht angeschaut. Log prüfen und den Lauf neu starten."
          fi

          titel="Pipeline-Fehler $phase"
          if [ -n "$entscheid" ] && [ "$entscheid" != "fehler" ]; then
            titel="$titel ($entscheid)"
          fi
          titel="$titel: $BETREFF"

          {
            echo "**$hinweis**"
            echo
            echo "- Gescheitert: $phase"
            echo "- Entscheid: ${entscheid:-keiner}"
            [ -n "$quelle" ] && echo "- Quelle: $quelle"
            [ -n "$grund" ] && echo "- Grund: $grund"
            [ -n "$fehler" ] && echo "- Fehler: $fehler"
            echo "- Lauf: $LAUF_URL"
            echo
            echo "Protokoll:"
            echo '```json'
            if [ -n "$protokoll" ]; then cat "$protokoll"; else echo "Kein Protokoll gefunden."; fi
            echo '```'
          } > "$RUNNER_TEMP/issue.md"
          # Ohne vorhandenes Label schlägt "gh issue create --label" fehl,
          # der Alarm bliebe genau im Fehlerfall aus.
          gh label create pipeline-fehler --color B60205 \
            --description "Fehler in der Newsletter-Pipeline" 2>/dev/null || true
          gh issue create \
            --title "$titel" \
            --label "pipeline-fehler" \
            --body-file "$RUNNER_TEMP/issue.md"

# Deploy: läuft über die Git-Integration von Cloudflare (Workers Builds). Jeder
# Push auf main, auch der Commit dieser Pipeline, löst dort Build und Deploy
# aus. Hier ist deshalb kein Deploy-Schritt und kein CLOUDFLARE_API_TOKEN nötig.
